[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitsy"
version = "0.4.0"
description = "Measure, in bits, what a model gets from its context."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
local = ["torch", "transformers"]
series = ["chronos-forecasting==2.2.2", "transformers>=4.48,<5"]

[tool.setuptools]
packages = ["bitsy"]
